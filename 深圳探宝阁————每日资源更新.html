        /* 在线客服样式 - 替换原有电话样式 */

        .message-list {

        .message {

        .image-grid {
            display: grid;
            grid-gap: 4px;
            margin-bottom: 10px;
            overflow: hidden;
            border-radius: 8px;
            max-width: 100%;
        }
        
        /* 图片网格布局 */
        .image-grid.one {
            grid-template-columns: 1fr;
            max-width: 300px;
        }
        
        .image-grid.two {
            grid-template-columns: 1fr 1fr;
            max-width: 600px;
        }
        
        .image-grid.three {
            grid-template-columns: 1fr 1fr;
        }
        
        .image-grid.three .image-item:nth-child(1) {
            grid-column: span 2;
            grid-row: span 1;
        }
        
        .image-grid.four {
            grid-template-columns: 1fr 1fr;
            max-width: 600px;
        }
        
        .image-grid.five, .image-grid.six {
            grid-template-columns: 1fr 1fr 1fr;
            max-width: 900px;
        }
        
        .image-grid.five .image-item:nth-child(1) {
            grid-column: span 2;
            grid-row: span 1;
        }
        
        .image-grid.five .image-item:nth-child(2) {
            grid-column: span 1;
            grid-row: span 1;
        }
        
        .image-grid.five .image-item:nth-child(3),
        .image-grid.five .image-item:nth-child(4),
        .image-grid.five .image-item:nth-child(5) {
            grid-column: span 1;
            grid-row: span 1;
        }
        
        .image-item {
            position: relative;
            overflow: hidden;
            background-color: #fff8e6; /* 暖色调图片占位背景 */
            border-radius: 8px;
        }
        
        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s;
            border-radius: 8px;
            /* 图片加载过渡 */
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .image-item img.loaded {
            opacity: 1;
        }
        
        .image-item img:hover {
            transform: scale(1.05);
        }
        
        /* 确保网格中的图片有统一的高度和比例 */
        .image-grid.one .image-item {
            aspect-ratio: 4 / 3;
        }
        
        .image-grid.two .image-item,
        .image-grid.four .image-item,
        .image-grid.five .image-item:nth-child(3),
        .image-grid.five .image-item:nth-child(4),
        .image-grid.five .image-item:nth-child(5),
        .image-grid.six .image-item {
            aspect-ratio: 1 / 1;
        }
        
        .image-grid.three .image-item:nth-child(1),
        .image-grid.five .image-item:nth-child(1) {
            aspect-ratio: 2 / 1;
        }
        
        .image-grid.three .image-item:nth-child(2),
        .image-grid.three .image-item:nth-child(3),
        .image-grid.five .image-item:nth-child(2) {
            aspect-ratio: 1 / 1;
        }
        
        /* 响应式设计：调整小屏幕上的图片大小 */
        @media (max-width: 768px) {
            .image-grid {
                max-width: 100% !important;
            }
            
            .image-grid.three .image-item:nth-child(1),
            .image-grid.five .image-item:nth-child(1) {
                aspect-ratio: 16 / 9;
            }
            
            .image-grid.five, .image-grid.six {
                grid-template-columns: 1fr 1fr;
            }
            
            .image-grid.five .image-item:nth-child(1) {
                grid-column: span 2;
            }
            
            .image-grid.five .image-item:nth-child(2) {
                grid-column: span 2;
            }
            
            .image-grid.five .image-item:nth-child(3),
            .image-grid.five .image-item:nth-child(4),
            .image-grid.five .image-item:nth-child(5) {
                grid-column: span 1;
            }
        }
        
        .message-content {
            font-size: 14px;
            line-height: 1.8;
            color: #5d4037; /* 暖色调内容文字 */
            white-space: normal;
            word-break: break-word;
            /* 优化HTML内容显示 */
            overflow-wrap: break-word;

        /* 优化HTML标签样式 */
        .message-content a {

        .message-content a:hover {

        .message-content br {

        }
        
        .message-content b, .message-content strong {
            color: #e65100;
        }
        
        /* 图片放大模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(87, 46, 27, 0.9); /* 暖色调模态框背景 */

        .modal.active {
            display: flex;

        .modal-content {

        .modal-content img {

        .modal-close {

        .modal-close:hover {

        .modal-nav {

            padding: 10px;
            border-radius: 50%;
            width: 60px;

            display: flex;
            align-items: center;

        }
        
        .modal-nav:hover {

        .modal-nav.prev {

        .modal-counter {

        .no-results {
            text-align: center;
            padding: 50px 20px;
            color: #b76e79; /* 暖色调无数据文字 */
            font-size: 16px;

        /* 响应式设计 */
        @media (max-width: 600px) {
            .container {
                max-width: 100%;

            .message {
                padding: 12px;

            .modal-nav {

            /* 移动端优化在线客服样式 */

            }
            
            .service-tip {

<body>
    <div class="container">
        <header>
            <h1>深圳安妮茶馆——全区资源分享</h1>
            <form class="search-bar" action="https://www.yiyidaohang.com/search" method="get">
                <input type="text" name="keyword" placeholder="搜索内容..." value="">
                <button type="submit">搜索</button>
            </form>
        </header>
        
        <div class="message-list">
            
                <div class="no-results">
                    <p>今日资源更新中，请等待。。。
                    抢先一步，请访问<a href="https://t.me/szkc200m">https://t.me/szkc200m </a></p>
                </div>
            
        </div>
    </div>
     <!-- 图片放大模态框 -->
    <div class="modal" id="imageModal">
        <span class="modal-close" onclick="closeModal()">×</span>
        <span class="modal-nav prev" onclick="changeImage(-1)">‹</span>
        <span class="modal-nav next" onclick="changeImage(1)">›</span>
        <div class="modal-content">
            <img id="modalImage" src="https://www.yiyidaohang.com/" alt="放大图片">
        </div>
        <div class="modal-counter" id="modalCounter"></div>
    </div>
    
    <script>
        // 图片模态框变量
        let modal = document.getElementById("imageModal");
        let modalImg = document.getElementById("modalImage");
        let modalCounter = document.getElementById("modalCounter");
        let currentImageIndex = 0;
        let allImages = [];
        let imageElements = [];
        
        // 初始化：收集所有图片并设置懒加载
        document.addEventListener('DOMContentLoaded', function() {
            // 收集图片元素和地址
            imageElements = document.querySelectorAll('.image-item img');
            imageElements.forEach(img => {
                allImages.push(img.getAttribute('data-src'));
                // 初始加载可视区域图片
                if (isInViewport(img)) {
                    loadImage(img);
                }
            });
            
            // 监听滚动实现懒加载
            window.addEventListener('scroll', lazyLoadImages);
            
            // 初始预加载
            preloadSurroundingImages(0);
        });
        
        // 懒加载图片
        function lazyLoadImages() {
            imageElements.forEach(img => {
                if (isInViewport(img) && !img.classList.contains('loaded')) {
                    loadImage(img);
                }
            });
        }
        
        // 检查元素是否在可视区域
        function isInViewport(el) {
            const rect = el.getBoundingClientRect();
            return (
                rect.top >= 0 &&
                rect.left >= 0 &&
                rect.bottom <= (window.innerHeight || document.documentElement.clientHeight) &&
                rect.right <= (window.innerWidth || document.documentElement.clientWidth)
            );
        }
        
        // 加载单张图片
        function loadImage(imgEl) {
            const src = imgEl.getAttribute('data-src');
            if (!src) return;
            
            const img = new Image();
            img.onload = function() {
                imgEl.src = src;
                imgEl.classList.add('loaded');
            };
            img.onerror = function() {
                console.error('图片加载失败:', src);
                // 加载失败时显示占位图（可选）
                imgEl.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZmZmOGU2Ii8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxMiIgZmlsbD0iI2I3NmU3OSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+5Zu+54mH5Yqh5omLPC90ZXh0Pjwvc3ZnPg==';
                imgEl.classList.add('loaded');
            };
            img.src = src;
        }
        
        // 预加载当前索引前后各1张图片
        function preloadSurroundingImages(currentIndex) {
            // 预加载前一张
            const prevIndex = currentIndex - 1;
            if (prevIndex >= 0 && prevIndex < allImages.length) {
                preloadImage(allImages[prevIndex]);
            }
            
            // 预加载后一张
            const nextIndex = currentIndex + 1;
            if (nextIndex >= 0 && nextIndex < allImages.length) {
                preloadImage(allImages[nextIndex]);
            }
        }
        
        // 预加载单张图片
        function preloadImage(src) {
            const img = new Image();
            img.src = src;
        }
        
        // 打开模态框
        function openModal(imageSrc, time) {
            modal.classList.add('active');
            modalImg.src = imageSrc;
            currentImageIndex = allImages.indexOf(imageSrc);
            updateCounter();
            document.body.style.overflow = 'hidden';
            
            // 预加载当前图片前后各1张
            preloadSurroundingImages(currentImageIndex);
        }
        
        // 关闭模态框
        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        
        // 切换图片
        function changeImage(direction) {
            currentImageIndex += direction;
            if (currentImageIndex < 0) {
                currentImageIndex = allImages.length - 1;
            } else if (currentImageIndex >= allImages.length) {
                currentImageIndex = 0;
            }
            
            const newSrc = allImages[currentImageIndex];
            modalImg.src = newSrc;
            updateCounter();
            
            // 预加载新图片前后各1张
            preloadSurroundingImages(currentImageIndex);
            
            // 同时加载页面中对应的图片（如果未加载）
            const targetImg = Array.from(imageElements).find(img => img.getAttribute('data-src') === newSrc);
            if (targetImg && !targetImg.classList.contains('loaded')) {
                loadImage(targetImg);
            }
        }
        
        // 更新图片计数器
        function updateCounter() {
            modalCounter.textContent = `${currentImageIndex + 1} / ${allImages.length}`;
        }
        
        // 点击模态框背景关闭
        modal.addEventListener('click', function(event) {
            if (event.target === modal) {
                closeModal();
            }
        });
        
        // 键盘导航
        document.addEventListener('keydown', function(event) {
            if (modal.classList.contains('active')) {
                if (event.key === 'Escape') {
                    closeModal();
                } else if (event.key === 'ArrowLeft') {
                    changeImage(-1);
                } else if (event.key === 'ArrowRight') {
                    changeImage(1);
                }
            }
        });
        
        // 左右滑动切换图片
        let startX = 0;
        let endX = 0;
        
        modalImg.addEventListener('touchstart', function(event) {
            startX = event.touches[0].clientX;
        });
        
        modalImg.addEventListener('touchend', function(event) {
            endX = event.changedTouches[0].clientX;
            handleSwipe();
        });
        
        function handleSwipe() {
            const threshold = 50;
            const diff = endX - startX;
            
            if (Math.abs(diff) > threshold) {
                if (diff > 0) {
                    // 向右滑动，上一张
                    changeImage(-1);
                } else {
                    // 向左滑动，下一张
                    changeImage(1);
                }
            }
        }
        
        // 打开客服页面
        function openCustomerService() {
            window.open('https://kefu.yiyidaohang.com/livechat?user_id=zxcvcv ', '_blank');
        }
        
        // 优化HTML内容显示
        function optimizeHtmlContent() {
            // 为所有message-content添加样式优化
            document.querySelectorAll('.message-content').forEach(content => {
                // 确保链接在新窗口打开
                content.querySelectorAll('a').forEach(link => {
                    if (!link.hasAttribute('target')) {
                        link.setAttribute('target', '_blank');
                    }
                    if (!link.hasAttribute('rel')) {
                        link.setAttribute('rel', 'noopener noreferrer');
                    }
                });
                
                // 优化换行显示
                content.querySelectorAll('br').forEach(br => {
                    br.style.display = 'block';
                    br.style.margin = '4px 0';
                });
                
                // 优化粗体文字
                content.querySelectorAll('b, strong').forEach(bold => {
                    bold.style.color = '#e65100';
                    bold.style.fontWeight = '600';
                });
            });
        }
        
        // 页面加载完成后优化内容
        document.addEventListener('DOMContentLoaded', function() {
            optimizeHtmlContent();
            // ... 其他初始化代码
        });
    </script>

</body></html>
